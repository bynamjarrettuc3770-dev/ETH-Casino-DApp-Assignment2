<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>去中心化赌场 DApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8892b0;
            margin-bottom: 30px;
        }
        .wallet-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .connect-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .connect-btn:hover {
            transform: scale(1.05);
        }
        .game-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .bet-input {
            width: 200px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 1rem;
            text-align: center;
        }
        .choice-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .choice-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .small-btn {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        .big-btn {
            background: #ff6b6b;
            color: #1a1a2e;
        }
        .choice-btn:hover {
            transform: scale(1.05);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
        }
        .win {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }
        .lose {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        .dice {
            font-size: 3rem;
            margin: 10px 0;
        }
        .history {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .address {
            font-size: 0.9rem;
            color: #8892b0;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 去中心化赌场</h1>
        <p class="subtitle">Decentralized Casino DApp</p>

        <div class="wallet-section">
            <p id="walletStatus">未连接钱包</p>
            <button class="connect-btn" onclick="connectWallet()">连接 MetaMask</button>
        </div>

        <div class="game-section">
            <h2>猜大小游戏</h2>
            <p>下注 ETH，猜骰子是小(1-3)还是大(4-6)，赢了拿2倍奖金！</p>
            
            <input type="number" id="betAmount" class="bet-input" placeholder="下注金额 (ETH)" step="0.01" min="0.01">
            
            <div class="choice-buttons">
                <button class="choice-btn small-btn" onclick="playGame(false)">小 (1-3)</button>
                <button class="choice-btn big-btn" onclick="playGame(true)">大 (4-6)</button>
            </div>

            <div id="resultArea"></div>
        </div>

        <div class="history">
            <h3>游戏历史</h3>
            <div id="historyList">
                <p style="color: #8892b0;">暂无记录</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
